# ScoutingNano muon tag-and-probe card for AK8 W/top SF ntuples.
# It reads Scouting collections only; offline PF/Muon/FatJet branches are not used.

extends:
  - ../base.yaml
  - ../common/scouting_branches_v15.yaml
  - ../common/stored_tagger_names_scouting_v15.yaml
  - ../common/read_branches_scouting_v15.yaml

era: "2024"
nano_version: "v15"

preselection: Sum$(ScoutingMuonVtx_pt>50 && abs(ScoutingMuonVtx_eta)<2.4)>0 && nScoutingFatPFJetRecluster>0

required_triggers:
  - DST_PFScouting_SingleMuon

input:
  strict_read_branches: true

output:
  include_lhe_weights: true
