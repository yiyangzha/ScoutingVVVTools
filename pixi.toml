[workspace]
authors = ["Jan-Frederik Schulte <jschulte@cern.ch>"]
channels = ["conda-forge", "nvidia"]
name = "ScoutingVVVTools"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
pandas = ">=3.0.3,<4"
numpy = ">=2.4.6,<3"
uproot = ">=5.7.4,<6"
matplotlib = ">=3.11.0,<4"
mplhep = ">=1.2.0,<2"
scikit-learn = ">=1.5"
scipy = ">=1.13"
zstandard = ">=0.23"

# CPU-only XGBoost for the default environment: it installs on hosts without a GPU.
[feature.cpu.dependencies]
py-xgboost-cpu = ">=2.1.4,<4"

# CUDA XGBoost for GPU training; install and run it on a GPU node.
[feature.gpu]
system-requirements = { cuda = "12" }

[feature.gpu.dependencies]
py-xgboost-gpu = ">=2.1.4,<4"

[environments]
default = ["cpu"]
gpu = ["gpu"]
